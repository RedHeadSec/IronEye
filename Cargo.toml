[package]
name = "ironeye"
version = "3.2.0"
edition = "2021"

[lib]
name = "ironeye"
path = "src/lib.rs"

[dependencies]
dialoguer = "0.10"
clap = { version = "4.3", features = ["derive"] }
chrono = "0.4"
rustyline = "11.0.0"
rusqlite = { version = "0.31", features = ["bundled"] }
base64 = "0.21" 
hex = "0.4"
rand = "0.8"
fastrand = "2.0"
byteorder = "1.4"
log = "0.4"
env_logger = "0.10"
ctrlc = "3.4"
csv = "1.1"
uuid = { version = "1", features = ["v4"] }
x509-parser = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt", "net"] }

# Crypto for shadow credentials
rcgen = "0.11"
rsa = "0.9"
sha2 = "0.10"
p12-keystore = { version = "0.3", features = ["pbes1"] }

# Kerberos attack library
cerbero_lib = { path = "lib/cerbero_lib", default-features = false }
kerberos_crypto = "0.3"
kerberos_constants = "0.0"
ms_pac = "0.0.4"

# Pass-the-Certificate (Schannel) LDAP auth: client-cert TLS config.
# Pulled in via ldap3's own "tls-rustls" feature (see below), pinned to the
# same 0.21 line ldap3 0.11.5 depends on.
rustls = { version = "0.21", default-features = false, features = ["dangerous_configuration"] }
rustls-pemfile = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# default-features = false drops ldap3's default "tls-native" backend
# (OpenSSL/Schannel/SecureTransport depending on OS) in favor of "tls-rustls"
# everywhere: one pure-Rust TLS stack across platforms, and the only backend
# that exposes set_config(Arc<rustls::ClientConfig>) for presenting a client
# certificate (needed for Pass-the-Cert auth). IronEye's own code never calls
# a native-tls-specific API, so this is a drop-in swap for existing LDAPS/
# StartTLS behavior.
[target.'cfg(target_os = "linux")'.dependencies]
ldap3 = { version = "0.11", default-features = false, features = ["sync", "gssapi", "tls-rustls"] }

[target.'cfg(target_os = "windows")'.dependencies]
ldap3 = { version = "0.11", default-features = false, features = ["sync", "gssapi", "tls-rustls"] }

[target.'cfg(target_os = "macos")'.dependencies]
ldap3 = { version = "0.11", default-features = false, features = ["sync", "tls-rustls"] }
